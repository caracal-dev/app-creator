<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#4a9eff"/>
    </linearGradient>
  </defs>
  <!-- Box body -->
  <rect x="16" y="32" width="96" height="72" rx="8" fill="url(#box)" stroke="#1d4ed8" stroke-width="2"/>
  <!-- Box lid -->
  <rect x="12" y="24" width="104" height="16" rx="4" fill="url(#lid)" stroke="#1d4ed8" stroke-width="2"/>
  <!-- Lid tab -->
  <rect x="52" y="20" width="24" height="8" rx="2" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>
  <!-- Ribbon vertical -->
  <rect x="56" y="32" width="16" height="72" fill="#f59e0b" opacity="0.85"/>
  <!-- Ribbon horizontal -->
  <rect x="16" y="58" width="96" height="12" fill="#f59e0b" opacity="0.85"/>
  <!-- "A" letter -->
  <text x="64" y="92" font-family="system-ui, sans-serif" font-size="36" font-weight="bold"
        fill="#ffffff" text-anchor="middle" dominant-baseline="central">A</text>
  <!-- AppImage arrow mark -->
  <path d="M80 78 L92 78 L92 90" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M92 78 L96 82 M92 78 L88 82" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
</svg>